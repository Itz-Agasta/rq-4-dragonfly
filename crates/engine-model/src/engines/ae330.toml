# Austro Engine E4P, sales name AE330. 1991 cm3, four cylinders in line,
# common-rail direct injection, wastegated fixed-geometry turbocharger,
# intercooled, FADEC, 1:1.69 reduction gearbox.
#
# WHY THIS ENGINE. TAPAS BH-201 flies it. Early prototypes carried NPO-Saturn
# 36MT turboprops and a Rotax 914; from prototype AF-5 the airframe carries twin
# 180 hp Austro E4P units, and Archer-NG inherits them. The indigenous engine
# that replaces it, the VRDE and Jayem Automotives 180 hp, is a different machine
# and not a licence build of this one: Jayem describe a 2.2 litre platform where
# the E4 is 1991 cm3 on a Mercedes-Benz OM640 block. It is not modelled here
# because five numbers are published about it and none of them is a curve, a bore,
# a stroke or a map. This engine has a type certificate, 5.5 million flight hours
# and a published rating point, so every claim below can be checked by a reader.
#
# CEILING. The type certificate limits the E4P to 20,000 ft and the E4 to
# 18,000 ft. The model is swept to 32,000 ft anyway, because that is the mission
# envelope a MALE airframe needs and the figure the indigenous programme quotes,
# and `docs/model_validation.md` marks everything above the certified ceiling as
# extrapolation. TAPAS has demonstrated 18 h at 28,000 ft on these engines.
# Do not quote the sweep above 20,000 ft as certified performance.
#
# Numbers marked `published` come from the EASA type certificate data sheet E.200
# for the Austro Engine E4 series and from the manufacturer factsheet, or from the
# Mercedes-Benz OM640 on whose block that engine is based. Numbers marked
# `estimated` are not published by anyone and were chosen from engine class, then
# fitted so the model reproduces the published rating point. Nothing here is
# measured on the engine itself.
#
# Coherence check on the published set: 550 N.m at the propeller divided by the
# 1.69 gearbox is 325.4 N.m at the crank, and 132 kW at 3880 rpm is 324.9 N.m.
# The two published figures therefore assume a lossless gearbox, and this model
# follows them rather than inventing a gearbox efficiency they contradict.
#
# https://www.easa.europa.eu/en/downloads/7617/en

name = "Austro Engine E4P (AE330), 180 hp heavy-fuel aero diesel"

[geometry]
displacement_m3 = 1.991e-3 # published, 1991 cm3
n_cyl = 4.0 # published
revs_per_cycle = 2.0 # published, four-stroke
bore_m = 0.0830 # published, OM640 block
stroke_m = 0.0920 # published, OM640 block
compression_ratio = 18.0 # published, OM640 block
gearbox_ratio = 1.69 # published, crank rpm per propeller rpm
# Rotating inertia referred to the crankshaft: crank, flywheel and gearbox, plus a
# representative constant-speed propeller reflected through the gearbox ratio. A
# different propeller changes this number, which is why it lives in the parameter
# file rather than in the code.
inertia_kg_m2 = 0.55 # estimated

[gas]
# Air properties are the standard cold-air values. Exhaust properties follow the
# burned-gas values used in the mean value diesel literature. Exhaust cp is derived
# from these two rather than listed, so the three can never disagree.
# Wahlstrom & Eriksson, Proc IMechE Part D 225(7), 2011, table 6.
r_air = 287.05 # published, dry air
cp_air = 1011.0 # published
gamma_air = 1.3964 # published
r_exh = 286.0 # published, burned gas
gamma_exh = 1.2734 # published, burned gas

[fuel]
# Jet A-1. A heavy-fuel engine burns kerosene, not diesel and certainly not avgas,
# which is the whole reason it exists on a military airframe.
lhv_j_per_kg = 43.0e6 # published, ASTM D1655 specification energy content
stoich_afr = 14.7 # published, kerosene stoichiometric air/fuel mass ratio
density_kg_m3 = 800.0 # published, nominal at 15 C, spec range 775 to 840

[manifolds]
# Control volumes. No published figure exists for either; both were chosen from the
# physical size of a 2 litre automotive diesel intake and exhaust, and they set the
# manifold filling time constants (roughly 18 ms intake, a few ms exhaust).
v_im_m3 = 3.0e-3 # estimated, includes the intercooler outlet duct
v_em_m3 = 1.0e-3 # estimated
# Exhaust manifold heat loss, as the product of a heat transfer coefficient and a
# wetted area; only the product is identifiable without a manifold skin measurement.
# Sized for roughly a 50 K drop between the port and the turbine inlet at full flow,
# which is why a thermocouple in the manifold reads cooler than the cylinder-out gas.
# Eriksson, "Mean value models for exhaust system temperatures", SAE 2002-01-0374.
h_loss_w_per_k = 23.0 # estimated

[cylinder]
# Volumetric efficiency, eta_vol = c1 sqrt(p_im) + c2 sqrt(omega_e) + c3.
# Parametric rather than a lookup table so it has three tunable numbers instead of
# a surface nobody can defend.
# Wahlstrom & Eriksson 2011, eq. 9.
c_vol = [6.0e-5, -0.0125, 1.1400] # estimated, fitted to the rating point
eta_vol_max = 1.00 # estimated, see the clamp note in cylinder.rs

# Combustion quality as an island in the fuel/air equivalence ratio. The three
# entries are the efficiency factor at zero fuelling, the peak efficiency factor,
# and the equivalence ratio at which the peak occurs. The peak sits at 0.55, an
# excess air ratio of 1.82, which is where a common-rail diesel is most efficient.
# Sivertsson & Eriksson, SIMS 2014, diesel-electric powertrain benchmark, with the
# load coordinate changed; see the note in cylinder.rs.
eta_ig_island = [0.45, 0.760, 0.55] # estimated

# In-cylinder ratio of specific heats falls as the charge is enriched. Truncated to
# first order in the equivalence ratio; the cited source fits a quadratic, which
# needs part-load data we do not have.
# Ekberg, Leek & Eriksson, SIMS 59, 2018, eq. 17d.
gamma_cyl = [1.35, -0.15] # estimated

# Scaling on the cylinder-out gas temperature. Fitted so that exhaust temperature at
# the take-off rating lands in the 700 to 850 C band a turbocharged diesel actually
# runs at ahead of the turbine; at unity the model was 150 K cooler than that. It
# lands next to the 1.2563 the cited work fits on a heavy-duty engine, which is
# reassuring but not the reason.
eta_sc = 1.21 # estimated

# Injected fuel mass per cylinder per cycle at full FADEC command. Fitted so that
# full command at the take-off speed reproduces the published power, torque and
# fuel consumption simultaneously.
u_f_max_mg = 67.4 # estimated

# Injector flow rate at rail pressure. Fixes the duration a controller commands for
# a given mass, which is the only per-cylinder fuelling quantity on the bus. Sized so
# the rated 67.4 mg is delivered in 4.0 ms, which is about an eighth of a cycle at the
# rated speed; a nozzle an order of magnitude slower would still be injecting when the
# exhaust valve opened.
injector_flow_g_per_s = 17.0 # estimated, common-rail solenoid nozzle at 1600 bar

# Per-cylinder injector flow scale, unity on a healthy engine. Present so that
# per-cylinder exhaust and head temperatures exist at all: with four identical
# scales the cylinders are identical, which is what a healthy engine looks like,
# and an injector fault is a departure of one of them from unity.
injector_scale = [1.0, 1.0, 1.0, 1.0] # estimated

# Per-cylinder combustion efficiency, unity on a healthy engine. A misfiring
# cylinder is fuelled and does not burn, so this falls while injector_scale stays
# at unity. Holding the two apart is what separates an injection fault from a
# combustion one downstream; see the note in params.rs.
combustion_efficiency = [1.0, 1.0, 1.0, 1.0] # estimated

[friction]
# Friction mean effective pressure in bar as a quadratic in crank speed in
# thousands of rpm, the classical form. Coefficients chosen to give 0.75 bar at
# 1000 rpm and 2.20 bar at the 3880 rpm take-off speed, which is the normal range
# for a small automotive-derived diesel; no published figure exists for this engine.
# Heywood, Internal Combustion Engine Fundamentals, 1988, ch. 13.
c_fr = [0.07822, 0.12178, 0.55] # estimated

[compressor]
# Ellipse model. The wheel radius and head coefficient set the pressure ratio the
# wheel can raise at a given speed; reaching the 3.10 bar set-point at sea level puts
# the shaft near 140,000 rpm, comfortably under the 178,000 rpm the type certificate
# demonstrates containment for. That margin is what makes the architecture viable and
# it was checked before any of this was written.
# Leufven & Eriksson, Control Engineering Practice 21(12), 2013.
r_wheel_m = 0.0285 # estimated, 57 mm wheel; sized so rated power holds to 11,000 ft
psi_max = 1.65 # estimated, dimensionless head coefficient
omega_ref = 18000.0 # estimated, normalisation near the containment speed
t_ref_k = 288.15 # published, ISA sea level, the correction reference
p_ref_pa = 101325.0 # published, ISA sea level, the correction reference
m_corr_max = [0.0252, 0.2053, 0.1153] # estimated, choke flow vs normalised speed
eta_max = 0.78 # estimated, peak for a small automotive-class compressor
phi_opt = 0.0600 # estimated, flow coefficient at the efficiency peak
omega_norm_opt = 0.78 # estimated
q_form = [79.27, 0.7985, -1.4358] # estimated, efficiency island shape
surge = [14.5, 0.60] # estimated, placed to give the design envelope a plausible margin
intercooler_effectiveness = 0.77 # estimated, air to air, ram cooled

[turbine]
# Effective area is the primary lever on boost, and therefore on where the critical
# altitude falls. Sized so the wastegate reaches its stop at the rated critical
# altitude rather than by picking a number that makes sea level look right.
area_eff_m2 = 4.95e-4 # estimated, the primary lever on where the knee falls
c_flow = [0.6859, 2.3633] # estimated, radial turbine flow function
r_wheel_m = 0.020 # estimated, 40 mm wheel
bsr_opt = 0.622 # estimated, blade speed ratio at peak efficiency
eta_max = 0.7075 # estimated, isentropic times mechanical
c_bsr = 2.0245 # estimated, curvature of the efficiency parabola

[wastegate]
area_eff_m2 = 2.00e-4 # estimated
c_flow = [0.6666, 5.3517] # estimated

[turbocharger]
# Rotor inertia. No figure is published for this turbocharger. A modelled diesel
# compressor wheel is 6e-5 kg m2 (Mishra & Saad 2017); scaling a 6.7 litre engine's
# turbocharger by displacement (Sivertsson & Eriksson 2014) gives 2.5e-5. This sits
# between the two, and it is corroborated rather than chosen: it puts the modelled
# spool at 1.5 s, and turbochargers of this size are measured at 1 to 2 s.
inertia_kg_m2 = 5.0e-5 # estimated
omega_max = 18640.0 # published, 178,000 rpm demonstrated containment
omega_min = 300.0 # estimated, floor so the shaft power balance stays finite

[control]
# The boost pressure the FADEC holds. At the rating point this gives an excess air
# ratio of about 1.55, comfortably clear of the smoke limit.
map_setpoint_pa = 3.10e5 # estimated, at full fuelling
map_setpoint_zero_pa = 0.20e5 # estimated, the schedule extrapolated to zero fuelling
# Gains are per pascal of error, so they look small. Sized for a loop an order of
# magnitude slower than the turbocharger shaft, because a boost controller faster
# than its actuator chatters against the wastegate stops.
kp = 8.0e-6 # estimated
ki = 2.0e-6 # estimated
integral_limit = 5.0e6 # estimated, anti-windup clamp
# Turbocharger overspeed supervision. Held at 95% of the certified containment
# speed, because containment is what the rotor survives once, not what it runs at.
turbo_omega_limit = 17700.0 # estimated, 169,000 rpm
kp_overspeed = 5.0e-3 # estimated

[thermal]
# Heat entering the head metal as a fraction of that cylinder's fuel energy. A
# common-rail diesel's energy balance is roughly 40% brake, 30% exhaust, 25%
# coolant, the rest oil and radiation; this is the coolant share.
heat_fraction_to_head = 0.25 # estimated
# Head-to-coolant conductance at the maximum engine speed. Sized so the head runs
# about 51 K above coolant at the canonical cruise point.
head_conductance_w_per_k = 199.0 # estimated
# About 3 kg of aluminium head per cylinder, which gives a 15 second thermal time
# constant. That is what makes a head temperature lag a fuelling change.
head_capacity_j_per_k = 2700.0 # estimated

[cooling]
# Radiator sized for the binding case, which for a liquid-cooled engine whose power
# lapses above 11,000 ft is a hot day at low altitude and low airspeed at full
# power, not high altitude. See the note in thermal.rs.
radiator_area_m2 = 0.110 # estimated
radiator_effectiveness = 0.70 # estimated
# Fraction of the approaching stream that passes through the core rather than
# spilling around it. Parsons & Harper, NBS Technical Paper 211, give 0.3 to 0.7
# for ordinary cores and note that a bare radiator in a free stream passes less
# than a third.
air_flow_constant = 0.50 # published range, value estimated within it
# Coolant charge plus the block metal it is closely coupled to, giving a thermal
# time constant of about a minute.
coolant_capacity_j_per_k = 60000.0 # estimated
# Without a thermostat the coolant would settle far below its working temperature
# at altitude, where the radiator has far more capacity than the engine needs.
thermostat_open_k = 356.0 # estimated
thermostat_band_k = 12.0 # estimated
bypass_fraction = 0.05 # estimated, the radiator is never fully isolated

[oil]
# Vogel coefficients fitted to a 15W-50 aviation multigrade: 0.096 Pa s at 40 C
# and 0.0157 Pa s at 100 C, with the pole fixed at 160 K as is conventional.
vogel = [1.545e-4, 985.0, 160.0] # estimated
# Pump displacement over leakage conductance. Sized to give 4.2 bar at 3720 rpm
# with the oil at 358 K. Only the group is identifiable without stripping the
# engine, which is why it is one number and not two.
pressure_coefficient = 48234.0 # estimated
relief_pressure_pa = 5.5e5 # estimated
# Piston-cooling jets carry combustion heat out of the piston crowns into the oil.
heat_fraction_from_fuel = 0.04 # estimated
capacity_j_per_k = 15000.0 # estimated, about 6 litres plus the sump
# The oil rejects to ram air through its own cooler rather than to the coolant.
# That is the aviation arrangement and it is also the only way oil can run cooler
# than coolant, which is what the operating data shows.
cooler_area_m2 = 0.028 # estimated
cooler_effectiveness = 0.65 # estimated
thermostat_open_k = 350.0 # estimated
thermostat_band_k = 12.0 # estimated
bypass_fraction = 0.08 # estimated

[limits]
rpm_max = 4220.0 # published, maximum engine overspeed
lambda_min = 1.30 # estimated, smoke limit for a modern common-rail diesel
rated_power_w = 132000.0 # published, take-off rating at 3880 rpm

# The redline set a conventional threshold monitor alarms on. Carried so the twin's
# detection can be timed against the monitor it replaces, on the same run. Oil and
# coolant come from EASA TCDS E.200 section IV, for the E4P specifically: the E4
# allows 140 C oil and 105 C coolant, and quoting those here would be the wrong
# variant. Exhaust and head are estimated, because the certificate publishes neither;
# on this engine both are held by the EECU's fuelling limiter rather than shown to a
# pilot, so there is no certificated number to cite.
[limits.redline]
oil_t_max_k = 412.15 # published, 139 C
oil_p_min_pa = 2.5e5 # published, 2.5 bar at maximum continuous
oil_p_max_pa = 6.5e5 # published, 6.5 bar
coolant_t_max_k = 373.15 # published, 100 C
egt_max_k = 1123.15 # estimated, 850 C, the top of the band a turbo diesel runs at
# The E4 publishes no cylinder head limit: Austro's Operation Manual limits oil,
# coolant, fuel and speed, its emergency procedures carry no CHT case, and the DA42
# G1000 does not display CHT. The head is held by the EECU fuelling limiter, not
# shown to a pilot, so the binding number is the aluminium alloy's strength bound.
# Measured diesel head metal reaches 558 K at the exhaust valve bridge, so 180 C is
# below what a real head runs at; read handover.md 6.3 before lowering this.
# Sharma, "Surface Temperature Prediction and Thermal Analysis of Cylinder Head",
# IJERA 3(4), fig. 12.
# https://www.ijera.com/papers/Vol3_issue4/ET34892902.pdf
cht_max_k = 523.15 # estimated, 250 C at the head metal
